# Netlify build settings for this site.
#
# The site is plain HTML, CSS and JavaScript with no build step and no
# dependencies, so Netlify just publishes the repository root as it is.
[build]
  publish = "."
  command = ""

# Headers are deliberately NOT set here. They all live in `_headers`, which
# carries the Content-Security-Policy the site is actually tested against —
# one file, one source of truth. Netlify applies both if both exist, which is
# how the same header ends up set twice with different values.
